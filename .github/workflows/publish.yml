# Stages a version tag (vX.Y.Z) on npm with provenance, using npm trusted publishing (OIDC):
# on npmjs.com, the package's Settings → Trusted Publisher names this repository, this workflow
# file (publish.yml) and the environment "npm", with only `npm stage publish` allowed. No npm
# token is stored here.
#
# The version is staged, not released: a maintainer reviews it on npmjs.com (Staged Packages) or
# with `npm stage approve <id>`, and approves it with 2FA. Only then is it installable.
#
# Guards — all must hold, or nothing is staged:
# - the repository variable NPM_PUBLISH_ENABLED is "true" (Settings → Secrets and variables →
#   Actions → Variables);
# - the tagged commit is on master (tags on other branches never publish);
# - the tag equals the package.json version, and the tests pass.
name: Publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag is on master
        run: |
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - name: The tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # npm stage publish needs Node 22.14+ and npm 11.15+.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.15.0
      - run: npm ci
      - run: npm test -- --ci
      # Access (public) and provenance come from package.json publishConfig.
      - run: npm stage publish
